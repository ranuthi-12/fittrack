# Database Configuration (MySQL database 'fittrack' on phpMyAdmin)
spring.datasource.url=jdbc:mysql://localhost:3306/fittrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Server
server.port=8080

# JWT
jwt.secret=fittrack_super_secret_key_2026_minimum_256_bits_long
jwt.expiration=86400000

# App
spring.application.name=fittrack-backend